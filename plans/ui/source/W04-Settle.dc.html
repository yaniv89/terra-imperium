<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  state = { sel: '2,6', probe: '4,5' };
  renderVals() {
    const sel = this.state?.sel ?? '2,6';
    const probe = this.state?.probe ?? '4,5';
    const X0 = 250, Y0 = 44;
    const cube = (r, c) => { const x = c - (r - (r & 1)) / 2; return { x, z: r, y: -x - r }; };
    const dist = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y), Math.abs(a.z - b.z));
    const cities = [{ name: 'Kish', at: cube(1, 1) }, { name: 'Uruk', at: cube(5, 3) }];
    const V = { s: 0.71, tx: 42.5, ty: -76 };
    const scr = ps => ps.map(([x, y]) => [x * V.s + V.tx, y * V.s + V.ty]);
    const ELAM = scr([[612,192],[680,180],[760,210],[840,238],[905,262],[880,320],[842,368],[790,398],[740,380],[680,320],[636,258]]);
    const GULF = scr([[1080,240],[990,268],[925,300],[885,330],[850,356],[815,395],[790,430],[750,490],[728,540],[700,640],[1080,640]]);
    const inside = (ps, x, y) => { let o = false; for (let i = 0, j = ps.length - 1; i < ps.length; j = i++) { const [xi, yi] = ps[i], [xj, yj] = ps[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) o = !o; } return o; };
    const info = {};
    const tiles = [];
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 11; c++) {
        const px = X0 + c * 40 + (r % 2) * 20, py = Y0 + r * 34.5;
        const cx = px + 20, cy = py + 23;
        if (inside(GULF, cx, cy)) continue;
        const id = r + ',' + c;
        const here = cube(r, c);
        let status = 'ok', title = '', detail = '';
        const isCity = cities.find(k => dist(k.at, here) === 0);
        const near = cities.map(k => ({ k, d: dist(k.at, here) })).sort((a, b) => a.d - b.d)[0];
        if (isCity) { status = 'city'; }
        else if (inside(ELAM, cx, cy)) { status = 'bad'; title = 'Belongs to Elam'; detail = 'Settle only in free land'; }
        else if (near.d < 4) { status = 'bad'; title = 'Too close to ' + near.k.name; detail = (near.d * 77 + 9) + ' km, needs 306'; }
        info[id] = { r, c, px, py, status, title, detail, near };
        const isSel = id === sel, isProbe = id === probe;
        const fill = status === 'city' ? 'rgba(91,155,240,0.28)' : status === 'bad' ? 'rgba(229,96,77,0.30)' : 'rgba(108,194,138,0.32)';
        const edge = isSel ? '#ECE5D3' : isProbe ? '#E5604D' : 'rgba(16,20,26,0.30)';
        tiles.push({
          x: px + 'px', y: py + 'px', fill, edge, inset: (isSel || isProbe) ? '3px' : '1px',
          aria: status === 'bad' ? title : 'Tile ' + id,
          pick: () => status === 'ok' ? this.setState({ sel: id }) : status === 'bad' ? this.setState({ probe: id }) : null
        });
      }
    }
    const s = info[sel] || info['2,6'];
    const p = info[probe];
    const seed = s.r * 7 + s.c * 3;
    const food = 2 + (seed % 3), prod = 1 + (seed % 2), gold = 1 + ((seed >> 1) % 2);
    const settlerAt = info['3,5'];
    const tilesAway = dist(cube(3, 5), cube(s.r, s.c));
    return {
      tiles,
      settler: { x: (settlerAt.px + 7) + 'px', y: (settlerAt.py + 10) + 'px' },
      probe: p ? { show: true, title: p.title, detail: p.detail, x: Math.min(p.px + 44, 560) + 'px', y: (p.py + 6) + 'px' } : { show: false },
      yields: [
        { k: 'Food', v: '+' + food, color: '#8FA36A' },
        { k: 'Production', v: '+' + prod, color: '#CDB27A' },
        { k: 'Gold', v: '+' + gold, color: '#D8A444' }
      ],
      notes: [
        { t: 'River tile: fresh water, +1 food', c: '#6FA3C8' },
        { t: 'Claims 7 tiles, 2 farmland', c: '#6CC28A' },
        { t: 'Nearest city ' + s.near.k.name + ', ' + (s.near.d * 77 + 9) + ' km', c: '#B9B19F' }
      ],
      eta: tilesAway === 0 ? 'Settler is on this tile' : 'Settler arrives in ' + Math.max(1, Math.ceil(tilesAway / 2)) + ' turn, then founds',
      foundLabel: tilesAway === 0 ? 'Found City here' : 'Go and Found City',
      lenses: ['Political', 'Settle', 'Yields', 'Loyalty', 'Supply', 'Threat'].map(n => ({ name: n, sel: n === 'Settle' ? 'true' : 'false', bg: n === 'Settle' ? '#232C38' : 'transparent', color: n === 'Settle' ? '#ECE5D3' : '#B9B19F', ring: n === 'Settle' ? '#ECE5D3' : 'transparent' })),
      tabs: [
        { name: 'City', icon: 'M4 20V10l4-3v13M8 20V5l5-2v17M13 20V9l7 3v8M3 20h18' },
        { name: 'Army', icon: 'M5 19L19 5M15 5h4v4M5 5l14 14M9 19H5v-4' },
        { name: 'Research', icon: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3' },
        { name: 'Diplomacy', icon: 'M3 12l4-4 4 3 3-3 4 1 3 3-6 6-3-2-3 2zM7 8l4 4' },
        { name: 'Lenses', icon: 'M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5' },
        { name: 'Menu', icon: 'M4 7h16M4 12h16M4 17h16' }
      ].map(t => ({ ...t, bg: t.name === 'Lenses' ? '#232C38' : 'transparent', color: t.name === 'Lenses' ? '#ECE5D3' : '#B9B19F', ring: t.name === 'Lenses' ? '#ECE5D3' : 'transparent' }))
    };
  }
}
</script>
