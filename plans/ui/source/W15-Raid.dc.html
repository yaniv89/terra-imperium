<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  state = { pick: 'refuse' };
  renderVals() {
    const pick = this.state?.pick ?? 'refuse';
    const O = [
      { id: 'pay', name: 'Pay 60 gold', cost: 'gold 142 to 82', text: 'No raid. Grudge -10. They tend to ask again in about 8 turns.', d: -10, go: 'Pay tribute', foot: 'Paying keeps the fields safe this time only.' },
      { id: 'refuse', name: 'Refuse and prepare', cost: 'expected loss', text: 'If they come: 2 fields pillaged (-4 food a turn, 3 turns), the Diyala outpost burned. Grudge +15. Or meet them: Raid on Kish fields.', d: 15, go: 'Refuse', foot: 'Kish garrison 120 is 1 turn from the fields.' },
      { id: 'hire', name: 'Hire mercenaries', cost: '40 gold + 4/turn', text: '80 Amorite spearmen from Mari (Mercantile), 6 turns, guard the fields. Grudge +15.', d: 15, go: 'Hire for 40', foot: 'Hired units fight like yours and leave when the contract ends.' }
    ];
    const cur = O.find(o => o.id === pick);
    const ghostW = Math.abs(cur.d);
    return {
      opts: O.map(o => ({ ...o, on: String(o.id === pick), pick: () => this.setState({ pick: o.id }),
        style: 'text-align: left; padding: 4px 9px; min-height: 44px; border-radius: 8px; cursor: pointer; color: #ECE5D3; font-family: Figtree, sans-serif; ' + (o.id === pick ? 'background: #232C38; border: 2px solid #ECE5D3' : 'background: #10141A; border: 1px solid #33404F') })),
      gDelta: (cur.d > 0 ? '+' : '') + cur.d + ' to ' + (45 + cur.d),
      gColor: cur.d > 0 ? '#E5604D' : '#6CC28A',
      gGhost: cur.d > 0
        ? 'width: ' + ghostW + '%; background: repeating-linear-gradient(45deg, #E5604D 0 3px, transparent 3px 6px)'
        : 'position: absolute; left: 35%; top: 0; height: 8px; width: ' + ghostW + '%; background: repeating-linear-gradient(45deg, #10141A 0 3px, #6CC28A 3px 6px)',
      goLabel: cur.go, foot: cur.foot
    };
  }
}
</script>
