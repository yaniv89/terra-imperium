name: Long campaign audit
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch: {}
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:scenarios -- --long | tee campaign-audit.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-audit
          path: campaign-audit.jsonl
