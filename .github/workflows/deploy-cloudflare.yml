name: Deploy to Cloudflare Pages

# The live site without GitHub Pages' 1 GB cap: every push to main builds the app at the root
# (VITE_BASE=/) into dist/ and uploads it to the Cloudflare Pages project terra-imperium
# (terra-imperium.pages.dev). Secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. GitHub Pages (docs/) keeps running until the switch is confirmed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Pages target, site at the root)
        run: npx vite build --outDir dist --emptyOutDir
        env:
          VITE_BASE: /
          NODE_OPTIONS: --max-old-space-size=12288

      # A test APK for Android, published next to the site at /terra-imperium.apk. It is a thin
      # Capacitor shell (android/) that opens the live site full screen in landscape, so it never
      # needs rebuilding for game changes. Debug-signed: install by allowing unknown sources.
      # Every APK step may fail without stopping the site deploy.
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 21

      - name: Build the Android test APK (opens the live site)
        continue-on-error: true
        run: |
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://terra-imperium.pages.dev/">' > www/index.html
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.server={url:'https://terra-imperium.pages.dev',cleartext:false,androidScheme:'https'};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/terra-imperium.apk
          ls -la ../dist/terra-imperium.apk

      - name: Create the Pages project (first run only)
        run: npx wrangler@3 pages project create terra-imperium --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler@3 pages deploy dist --project-name terra-imperium --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
