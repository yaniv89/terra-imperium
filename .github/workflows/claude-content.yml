# AI content jobs for our development work (plans/ai-output/README.md). Manual runs only: no
# pull_request or schedule trigger, so no fork or bot ever reaches the ANTHROPIC_API_KEY secret.
# The key goes to the one step that runs the job; the results come back as a new branch
# ai/<job>-<run_id> for review, never pushed to main or claude/integration.
name: Claude content
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        type: choice
        options:
          - hebrew-review
          - glossary-notes
          - event-cards
          - fact-check
          - screenshot-qa
          - playtester
          - tech-unlocks
          - human-playtest
      limit:
        description: Only the first N requests (a small trial run); empty for the full job. human-playtest, the most steps (default 60)
        required: false
        default: ''
      max_usd:
        description: Refuse to start if the worst-case cost is over this many dollars
        required: false
        default: '12'
      cards_ref:
        description: fact-check only, the git ref whose plans/ai-output/event-cards/cards.json is checked
        required: false
        default: origin/ai/event-cards-39615084757
      seeds:
        description: playtester only, how many 300-turn games to play (seeds 1000, 1001, ...)
        required: false
        default: '1'
      persona:
        description: human-playtest only, who plays
        required: false
        type: choice
        default: newcomer-phone
        options: [newcomer-phone, civ-veteran, warmonger, builder, rts-commander, hebrew-speaker]
      slices:
        description: human-playtest only, extra late-game sessions, e.g. bronze,classical,gunpowder,modern,information (empty = the start only)
        required: false
        default: ''
      size:
        description: human-playtest only, phone (844x390 touch) or desktop (1600x900)
        required: false
        type: choice
        default: phone
        options: [phone, desktop]
      lang:
        description: human-playtest only, en or he (empty = the persona's)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: claude-content-${{ inputs.job }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # the job step must not find a GitHub token in .git/config
          fetch-depth: 0 # every branch, so fact-check can `git show <cards_ref>:<path>`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the inputs
        env:
          LIMIT: ${{ inputs.limit }}
          MAX_USD: ${{ inputs.max_usd }}
          CARDS_REF: ${{ inputs.cards_ref }}
          SEEDS: ${{ inputs.seeds }}
          SLICES: ${{ inputs.slices }}
          LANG_UI: ${{ inputs.lang }}
        run: |
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit must be a whole number"; exit 1; }
          [[ "$MAX_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "max_usd must be a number"; exit 1; }
          [[ "$CARDS_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "cards_ref must be a plain git ref"; exit 1; }
          [[ "$SEEDS" =~ ^[1-9]$ ]] || { echo "seeds must be 1 to 9"; exit 1; }
          [[ "$SLICES" =~ ^[a-z,\ ]*$ ]] || { echo "slices must be age ids separated by commas"; exit 1; }
          [[ -z "$LANG_UI" || "$LANG_UI" =~ ^(en|he)$ ]] || { echo "lang must be en or he"; exit 1; }
      # screenshot-qa: a build with the QA state hook (VITE_QA_HOOK, never the deployed site), served
      # by the static preview, shot by scripts/ui/qa-shots.mjs in Playwright's Chromium (software WebGL).
      # human-playtest plays the same build in the job step (the preview keeps running between steps).
      - name: Build and serve the QA game
        if: inputs.job == 'screenshot-qa' || inputs.job == 'human-playtest'
        env:
          VITE_QA_HOOK: '1'
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          npx playwright install --with-deps chromium
          npx vite build --outDir dist --emptyOutDir
          nohup npm run preview > preview.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:4173/terra-imperium/ > /dev/null && break; sleep 2; done
      - name: Capture the screenshots
        if: inputs.job == 'screenshot-qa'
        env:
          SWGL: '1'
        run: |
          node scripts/ui/qa-shots.mjs --url http://localhost:4173/terra-imperium/ --out plans/ai-output/screenshot-qa/shots
          du -sh plans/ai-output/screenshot-qa/shots
      - name: Play the headless games
        if: inputs.job == 'playtester'
        env:
          SEEDS: ${{ inputs.seeds }}
        run: node scripts/simulate.mjs --policy scripted --turns 300 --games "$SEEDS" --digest plans/ai-output/playtester/digest.json
      - name: Run the job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOB: ${{ inputs.job }}
          LIMIT: ${{ inputs.limit }}
          MAX_USD: ${{ inputs.max_usd }}
          CARDS_REF: ${{ inputs.cards_ref }}
          PERSONA: ${{ inputs.persona }}
          SLICES: ${{ inputs.slices }}
          SIZE: ${{ inputs.size }}
          LANG_UI: ${{ inputs.lang }}
          SWGL: '1'
        run: node "scripts/ai/$JOB.mjs" --max-usd "$MAX_USD" ${LIMIT:+--limit "$LIMIT"}
      - name: Push the results to a new branch
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="ai/$JOB-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "plans/ai-output/$JOB"
          git diff --cached --quiet && { echo "The job wrote nothing"; exit 1; }
          git commit -m "AI content: $JOB (run $RUN_ID)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
          echo "Results on branch $branch" >> "$GITHUB_STEP_SUMMARY"
